name: Build Windows desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - run: python -m pytest -q
      - name: Build installer and portable package
        shell: pwsh
        run: |
          $isccPath = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $isccPath)) {
            choco install innosetup --yes --no-progress
          }
          python scripts/build_desktop.py --iscc $isccPath
      - run: python scripts/verify_desktop.py
      - run: python scripts/verify_installer.py --iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: LearningCompass-2026.10.13-windows-x64
          path: release/*
